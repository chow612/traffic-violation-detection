apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: node-exporter
  namespace: argocd
spec:
  project: foundation
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus-node-exporter
      targetRevision: 4.59.0
      helm:
        valueFiles:
          - $values/devops/infrastructure/monitoring/node-exporter/values.yaml
    - repoURL: git@github.com:chow612/traffic-violation-detection.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
