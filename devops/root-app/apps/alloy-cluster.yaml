apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy-cluster
  namespace: argocd
spec:
  project: foundation
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.13.1
      helm:
        valueFiles:
          - $values/devops/infrastructure/monitoring/alloy-cluster/values.yaml
    - repoURL: git@github.com:chow612/traffic-violation-detection.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
