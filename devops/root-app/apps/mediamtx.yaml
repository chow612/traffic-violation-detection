apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mediamtx
  namespace: argocd
spec:
  project: foundation
  sources:
    - repoURL: https://startechnica.github.io/apps
      chart: mediamtx
      targetRevision: 0.1.1
      helm:
        valueFiles:
          - $values/devops/infrastructure/streaming/mediamtx/values.yaml
    - repoURL: git@github.com:chow612/traffic-violation-detection.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: streaming
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
