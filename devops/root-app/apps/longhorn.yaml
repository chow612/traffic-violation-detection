apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  project: foundation
  sources:
    - repoURL: https://charts.longhorn.io/
      chart: longhorn
      targetRevision: 1.12.1
      helm:
        releaseName: longhorn
        valueFiles:
          - $values/devops/infrastructure/longhorn/values.yaml
    - repoURL: git@github.com:chow612/traffic-violation-detection.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system