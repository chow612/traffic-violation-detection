# PostgreSQL
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgresql
  namespace: argocd
spec:
  project: foundation
  source:
    repoURL: git@github.com:chow612/traffic-violation-detection.git
    targetRevision: main
    path: devops/root-app/apps/postgresql
  destination:
    server: https://kubernetes.default.svc
    namespace: databases